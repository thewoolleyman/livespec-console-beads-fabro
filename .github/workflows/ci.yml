# Per-target matrix CI for livespec-console-beads-fabro (the fleet's one RUST repo).
#
# The check matrix + check-doctor-static run in the SAME baked image the Fabro
# sandbox uses, on the local self-hosted runner — so "green in CI" and "green in
# sandbox" are the same environment (livespec plan/fabro-ci-image-factoring).
# The tag is python-rust-v0.48.2: the layered Rust image, and specifically the
# tag THIS repo's own .fabro/workflows/implement-work-item/workflow.toml pins.
# Do NOT copy the Python members' python-v0.43.2 — a different layer AND a
# drifted tag (livespec-dev-tooling-xb7).
#
# RUNNER ROUTING — FAILS CLOSED TO HOSTED CAPACITY.
#
# runs-on resolves from the repo variable CI_RUNNER_LABELS, defaulting to
# '["ubuntu-latest"]' when it is absent or empty. That default is the
# merge-gate safety property, not a convenience: livespec
# SPECIFICATION/non-functional-requirements.md §"Self-hosted CI runner host
# requirements" → "Availability MUST NOT become a merge dependency" requires a
# route back to hosted capacity that needs no specification revision, because a
# single all-green gate is the sole required check. ci-green needs the check
# jobs, so one routed to self-hosted capacity that is not there does not FAIL —
# it sits in `queued`, ci-green never reports, and every merge waits on a check
# that will not arrive. Defaulting to the self-hosted label made exactly that
# outcome the behavior of an absent variable.
#
# To route gating jobs to a conforming self-hosted host, SET CI_RUNNER_LABELS
# to that host's label. To return them to hosted capacity, unset it or set it
# to '["ubuntu-latest"]'. Both directions are repo-variable edits; neither
# needs a specification revision.
#
# The fallback literal is repeated inline at each runs-on rather than
# single-sourced through a job output, and every copy MUST stay in lockstep.
# The repetition is deliberate: the fleet's self-hosted routing guard parses
# runs-on values STATICALLY, so routing hidden behind `needs.<job>.outputs.*`
# would read as "this workflow has no self-hosted job" and silently disable the
# forbidden-trigger check.
#
# livespec-s43svm.16 CUTOVER NOTE (2026-08-17): CI_RUNNER_LABELS now points at
# the ARC scale set `livespec-console-beads-k3s` (single-element JSON array —
# confirmed live that this routes correctly to an ARC gha-runner-scale-set,
# unlike a multi-label array combined with `self-hosted`, which PR #1431 in
# livespec-dev-tooling found unroutable). This is real production traffic on
# the k3s/ARC path, not a proof-of-life dispatch; the podman pool remains
# configured and otherwise idle for this repo.
#
# RENAMED from `livespec-console-beads-fabro-local-ci-k3s` (41 chars) the same
# day: that name triggered livespec-s43svm.22, an ARC workflow-pod naming
# collision (runner-container-hooks truncates the per-job pod name at 63
# characters on the FULL runner-pod name, eating the per-runner unique suffix
# past ~35 characters of scale-set name — upstream
# actions/actions-runner-controller#4368, closed won't-fix). This job matrix's
# own concurrent dispatch is livespec-s43svm.22's controlled proof that the
# short name (26 chars) does not collide.
#
# See livespec/plan/fleet-ci-runner-pool/research/k3s-arc-kueue-migration.md
# and the livespec-s43svm.16 / .22 ledger comments for the full record.
#
# ci-green stays ubuntu-latest so the branch-protection context is reportable
# host-down.

name: CI

# merge_group is deliberately ABSENT: no merge queue is configured for this repo
# (verified live — zero rulesets, required_merge_queue: null; branch protection
# requires only ci-green). Keeping the vestigial trigger would be exactly the
# routing hole the trusted-event audit forbids, since merge_group is not a
# fork-gated event and the jobs below are self-hosted. Re-add it WITH hosted
# routing only if a merge queue is adopted.
env:
  # uv's own concurrent-downloads default is 50 in-flight fetches PER uv
  # invocation (docs.astral.sh/uv/reference/settings/#concurrent-downloads).
  # This repo's CI never runs a bare `uv sync`, but its `just` targets drive
  # `uv run`, which performs an implicit sync and fetches from PyPI exactly the
  # same way -- so counting `uv sync` occurrences in this file reports zero
  # while the exposure is real (livespec-s43svm.31 records that measurement
  # error).
  #
  # The self-hosted pool runs many job slots concurrently on ONE host, so a
  # cold-cache moment (fresh slots, or a lockfile bump) can open thousands of
  # simultaneous connections to files.pythonhosted.org from a single shared
  # uplink -- the cause of the "operation timed out" PyPI fetch failures that
  # have red-flagged gating CI on the pool (livespec-s43svm.13, and the
  # recurrence livespec-s43svm.31 that brought these variables here). Capping
  # per-job concurrency on the self-hosted lane trades a little per-job fetch
  # latency for bounding the HOST-WIDE aggregate connection count; the hosted
  # lane's fully-isolated, independent-network-path runners never see this
  # contention, so it stays at uv's own default there. UV_HTTP_TIMEOUT is
  # bumped alongside it on the self-hosted lane, since a still-congested
  # transfer is more likely to need longer than the 30s default even at
  # reduced concurrency.
  #
  # The `|| '["ubuntu-latest"]'` default carries the same fail-closed property
  # as the runs-on fallbacks below and MUST stay in lockstep with them.
  UV_CONCURRENT_DOWNLOADS: ${{ contains(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]', 'ubuntu') && '50' || '4' }}
  UV_HTTP_TIMEOUT: ${{ contains(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]', 'ubuntu') && '30' || '60' }}

on:
  pull_request:
  push:
    branches: [master]

jobs:
  check:
    name: ${{ matrix.target }}
    # Hosted by default; set the CI_RUNNER_LABELS repo variable to a conforming
    # self-hosted host's label to route to it instead.
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    container:
      image: ghcr.io/thewoolleyman/livespec-fabro-sandbox:python-rust-v1.36.0
    env:
      # The image installs the pinned tools under /root (build-time HOME), but
      # container-hooks run steps with a DIFFERENT HOME — so mise's default data
      # dir ($HOME/.local/share/mise) is empty and `mise install` would RE-fetch
      # every tool. At matrix scale that means concurrent UNauthed GitHub-API
      # installs, which blow the anonymous rate limit and red the run (proven
      # live on livespec's cutover). Point mise at the baked data dir so
      # `mise install` is a true no-op.
      MISE_DATA_DIR: /root/.local/share/mise
      # A missing shim must fail fast, never busy-loop on auto-install.
      MISE_NOT_FOUND_AUTO_INSTALL: "0"
      # Defense-in-depth against GitHub's anonymous REST limit (60/hr PER IP):
      # the self-hosted matrix shares ONE host IP, and this repo's
      # taiki-e/install-action steps DOWNLOAD cargo tools from GitHub releases on
      # every run — exactly the kind of residual API traffic that hits the anon
      # wall. The per-run, auto-revoked, read-scoped Actions token lifts them to
      # the authenticated (~1000/hr) cap. NOT a Kind-2 secret.
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - check-format
          - check-clippy
          - check-nextest
          - check-coverage
          - check-deps
          - check-arch
          - check-behavior-coverage
          - check-completeness
          # The `baseline` worktree-discipline verifier — REUSES the shared
          # livespec-dev-tooling installer + verifier (no re-implementation),
          # per livespec/SPECIFICATION/non-functional-requirements.md
          # §"Conformance Pattern". A fresh actions/checkout is structurally a
          # primary (git-dir == git-common-dir) with no bootstrap run, so the
          # installer step below must install the canonical hook BEFORE the
          # verifier runs (mirroring livespec-dev-tooling's own CI).
          - check-baseline
          - check-shell-quality
          - check-plan-no-tombstone
          - check-plugin-resolution
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Hosted routing (CI_RUNNER_LABELS='["ubuntu-latest"]') keeps the baked
      # container: image, so git runs as ROOT over a uid-1001 checkout →
      # "detected dubious ownership" (exit 128) on every post-checkout git call.
      # actions/checkout's own safe.directory is scoped to a temp HOME it
      # discards, and resolve_repo_root() strips all GIT_* env before shelling
      # git, so an env-var safe.directory is invisible. Write it to the global
      # gitconfig (HOME=/github/home, preserved across the scrub) so every git
      # call reads it. No-op on the self-hosted lane.
      - name: Trust workspace for git (hosted container root-vs-checkout uid)
        run: git config --global --add safe.directory '*'

      # The Rust toolchain is BAKED into the python-rust image (rustc/cargo/
      # clippy/rustfmt at /root/.cargo/bin, at the channel rust-toolchain.toml
      # pins — that agreement is asserted by console-arch-check's
      # `check_fabro_image_rust_toolchain`, which probes the image itself), so
      # `mise install` is a near-no-op that just confirms the pinned versions.
      # A fresh container does not TRUST the repo .mise.toml, so `mise trust` is
      # required for the shims to resolve.
      - name: mise trust + install (baked tools — install is a near-no-op)
        run: |
          mise trust
          mise install

      # The actions/cache steps (cargo registry + git + target, and the uv cache
      # for check-baseline) are DELETED — this is not a leap of faith, it was
      # MEASURED in this exact image on this host against the real workspace:
      #   cargo clippy --workspace --all-targets  COLD here 37s vs 53s WARM-cached on ubuntu-latest
      #   cargo test  --workspace                 COLD here 35s vs 48s WARM-cached on ubuntu-latest
      # A cold build on this 18-core box beats a warm-cached build on a 2-4 core
      # GitHub runner, so the cache was buying nothing we cannot out-compute. And
      # KEEPING actions/cache on a self-hosted runner would be actively worse: it
      # would network-restore/save a multi-GB cache FROM this host every run —
      # precisely the cost co-locating removes — while fighting the 10 GB/repo cap.
      # (check-coverage/check-nextest build under different profiles, so the warm
      # cache barely helped them even before this change.)

      # ---- baseline (worktree-discipline) reuse: uv env + hook install ----
      - name: Install commit-refuse hook (satisfy baseline verifier)
        if: matrix.target == 'check-baseline'
        run: just install-commit-refuse-hooks

      # SPLIT OUT of the combined step above so the pack can be installed for a
      # SECOND target without also installing commit-refuse hooks into a job
      # that has no use for them.
      #
      # check-shell-quality NEEDS the pack, and without it that check was passing
      # VACUOUSLY here. `dev-tooling/*.just` is gitignored and the root justfile
      # imports it OPTIONALLY (`import? 'dev-tooling/worktree.just'`), so on a
      # fresh `actions/checkout` the `worktree-*` recipes DO NOT EXIST and the
      # scan had no subject — green for work it never did. This holds for THIS
      # repo despite its product being Rust: the worktree-discipline pack and the
      # justfile that imports it are language-independent, and both are present
      # here (measured, not assumed).
      #
      # Propagation of livespec-dev-tooling-9ywf, which fixed exactly this in the
      # producer on 2026-08-03 and was never carried to consumers; work-item
      # livespec-dev-tooling-y6e2, per-repo item
      # livespec-console-beads-fabro-g0u. Adoption precedes this enforcement:
      # with the current canonical pack installed, `just check-shell-quality`
      # exits 0 with ZERO violations in all nine fleet repos, measured
      # individually before the change. The control proving the gate can still
      # fail is real rather than synthetic — the PREVIOUS pack (sha256
      # 4fcac10a…) yields six violations across `worktree-create`,
      # `worktree-land` and `worktree-reap`.
      - name: Install canonical worktree pack (satisfy pack invariant)
        if: >-
          matrix.target == 'check-baseline'
          || matrix.target == 'check-shell-quality'
        run: just install-worktree-pack

      # Prebuild ALL FOUR quality tools (not just the target's own) for every job
      # that calls `just ensure-rust-quality-tools`. That recipe does
      # `command -v <tool> || cargo install --locked <tool>`, so any tool NOT on
      # PATH is compiled FROM SOURCE — ~740s wasted per job on this self-hosted
      # runner (measured 2026-07-18: check-deps spent its whole 810s building
      # nextest+llvm-cov from source). The taiki-e prebuilt binaries are on PATH,
      # so ensure-rust-quality-tools finds them and returns immediately.
      - name: Install rust quality tools (prebuilt — avoids source builds)
        if: matrix.target == 'check-nextest' || matrix.target == 'check-coverage' || matrix.target == 'check-deps'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-llvm-cov,cargo-deny,cargo-machete

      # ---- Phase-span split (livespec-console-beads-fabro-icmvza) ----------
      # export-ci-telemetry.sh emits one build.phase span per step named
      # "Phase: compile" / "Phase: test" in the critical-path jobs, deriving the
      # duration from that step's own start/end times. To feed it WITHOUT paying
      # a second compile, check-nextest gets a warm `--no-run` compile step
      # (build.phase=compile) followed by the real recipe running test-only (the
      # warm test binaries are reused — same `--workspace --all-features` flags,
      # so no recompile); check-clippy is compile-only, so its single recipe step
      # simply carries the "Phase: compile" name. check-coverage is INTENTIONALLY
      # not split: `cargo llvm-cov` cleans and re-instruments by default, so a
      # prepended warm build would DOUBLE-COMPILE the 100% coverage gate — a
      # regression against this plan's own build-time goal; deferred on the item.
      - name: "Phase: compile"
        if: matrix.target == 'check-nextest'
        run: cargo nextest run --workspace --all-features --no-run

      - name: "Phase: test"
        if: matrix.target == 'check-nextest'
        run: just check-nextest

      - name: "Phase: compile"
        if: matrix.target == 'check-clippy'
        run: just check-clippy

      - name: just ${{ matrix.target }}
        if: matrix.target != 'check-nextest' && matrix.target != 'check-clippy'
        run: just ${{ matrix.target }}

  # livespec core's doctor STATIC phase (reference-discipline + out-of-band
  # invariants), wired fleet-wide per livespec epic livespec-6jfq. core ships
  # the checker (doctor_static.py — self-contained, bare python3); this job
  # checks core out at the tag THIS repo pins (.livespec.jsonc compat.pinned)
  # and points the recipe at it via LIVESPEC_CORE_PLUGIN_ROOT. Its OWN job
  # (not the matrix above) because it needs a second checkout — livespec core
  # — that no other target does.
  check-doctor-static:
    name: check-doctor-static
    # Self-hosted in the baked image. The livespec-core checkout below is a fresh
    # PUBLIC clone INSIDE the container (no host mount — containment preserved).
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    container:
      image: ghcr.io/thewoolleyman/livespec-fabro-sandbox:python-rust-v1.36.0
    env:
      MISE_DATA_DIR: /root/.local/share/mise
      MISE_NOT_FOUND_AUTO_INSTALL: "0"
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Trust the workspace for git under hosted routing (baked container runs
      # git as ROOT over a uid-1001 checkout → "dubious ownership" exit 128).
      # See the `check` job for the full rationale. No-op on the self-hosted lane.
      - name: Trust workspace for git (hosted container root-vs-checkout uid)
        run: git config --global --add safe.directory '*'

      - name: mise trust + install (baked tools — install is a near-no-op)
        run: |
          mise trust
          mise install

      - name: Resolve pinned livespec core ref (.livespec.jsonc compat.pinned)
        id: corepin
        run: |
          pinned="$(grep -oE '"pinned"[[:space:]]*:[[:space:]]*"[^"]*"' .livespec.jsonc | head -1 | sed -E 's/.*:[[:space:]]*"([^"]*)".*/\1/')"
          echo "ref=${pinned:-master}" >> "$GITHUB_OUTPUT"

      - name: Checkout livespec core at the pinned ref
        uses: actions/checkout@v4
        with:
          repository: thewoolleyman/livespec
          ref: ${{ steps.corepin.outputs.ref }}
          path: .livespec-core

      # The orchestrator is the one sibling this spec tree cites by section
      # (`.livespec.jsonc` `external_references`, added with v041's per-item
      # dispatch argv contract). Its `cross_repo_targets.local_clone` is the
      # host-absolute /data/projects/livespec-orchestrator-beads-fabro, which
      # cannot exist on a runner — and an ABSENT clone is not treated as
      # "unvalidatable, keep the allowlist": no_cross_spec_reference maps the
      # unreadable file to an EMPTY heading set, _validated_external_references
      # then DROPS every entry for that repo, and the check fails with the
      # misleading "is not allowlisted" (PR #742, 2026-08-21; identical trap
      # documented in livespec-driver-claude's ci.yml). A real checkout under
      # LIVESPEC_SIBLING_CLONES_ROOT takes precedence over local_clone and makes
      # CI validate citations against the orchestrator's ACTUAL headings —
      # strictly stronger than the allowlist alone. Public repo, default token.
      - name: Checkout the orchestrator sibling (cited by external_references)
        uses: actions/checkout@v4
        with:
          repository: thewoolleyman/livespec-orchestrator-beads-fabro
          ref: master
          path: .livespec-siblings/livespec-orchestrator-beads-fabro

      - name: just check-doctor-static
        run: |
          # In a container job, github.workspace (context) may be the HOST path;
          # $GITHUB_WORKSPACE (env) is the in-container mount, so derive the core
          # plugin root from it to stay container-correct.
          export LIVESPEC_CORE_PLUGIN_ROOT="${GITHUB_WORKSPACE}/.livespec-core/.claude-plugin"
          export LIVESPEC_SIBLING_CLONES_ROOT="${GITHUB_WORKSPACE}/.livespec-siblings"
          just check-doctor-static

  # Real-TUI end-to-end gate (DELIVERABLE #0): drives the SHIPPED interactive TUI
  # through a real tmux pane (send-keys -> capture-pane -> assert), the first
  # automated coverage of the run_interactive_tui raw-mode/render path that the
  # rest of the pyramid compiles out. Its OWN job (not the matrix above) because
  # it needs `tmux`, which the base image does not yet carry — the step below
  # provisions it so the gate is self-sufficient regardless of the image (baking
  # tmux into the fabro-sandbox image is the follow-up that lets this step drop).
  #
  # MERGE-BLOCKING since 2026-07-21: it is in `ci-green.needs` below. It landed
  # advisory, to prove stable here first, and that grace period ended badly —
  # `2cd1f28` left `tmux_tui_e2e_status_line_context_hints` red and PRs #360,
  # #361, #362 and #365 each merged with `check-e2e-tmux = FAILURE` while
  # `ci-green` reported SUCCESS. Master's CI sat red for that whole span,
  # because an advisory check is one nobody is required to read.
  #
  # The cost of promoting it is real and accepted: every merge on this repo now
  # depends on a job that needs `tmux` (provisioned below) and a release binary.
  # If that dependency makes the job flaky, fix the job — reverting to advisory
  # reopens the exact gap above.
  check-e2e-tmux:
    name: check-e2e-tmux
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    container:
      image: ghcr.io/thewoolleyman/livespec-fabro-sandbox:python-rust-v1.36.0
    env:
      MISE_DATA_DIR: /root/.local/share/mise
      MISE_NOT_FOUND_AUTO_INSTALL: "0"
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Trust the workspace for git under hosted routing (baked container runs
      # git as ROOT over a uid-1001 checkout → "dubious ownership" exit 128).
      # See the `check` job for the full rationale. No-op on the self-hosted lane.
      - name: Trust workspace for git (hosted container root-vs-checkout uid)
        run: git config --global --add safe.directory '*'

      - name: mise trust + install (baked tools — install is a near-no-op)
        run: |
          mise trust
          mise install

      - name: Provision tmux (harness dependency, absent from the base image)
        run: |
          if ! command -v tmux >/dev/null 2>&1; then
            apt-get update && apt-get install -y --no-install-recommends tmux
          fi
          tmux -V

      - name: just check-e2e-tmux
        run: just check-e2e-tmux

  # Merge-gate mutation run (livespec-console-beads-fabro-txtzn5.10). Scoped by
  # --in-diff to the code the PR actually touches: a FULL sweep of these two
  # packages is 1456 mutants and at least 46 minutes (measured; that is a
  # floor), which is not a merge gate. fetch-depth 0 is REQUIRED — the diff is
  # computed against the base ref, and a shallow checkout cannot reach it.
  check-mutants:
    name: check-mutants
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    container:
      image: ghcr.io/thewoolleyman/livespec-fabro-sandbox:python-rust-v1.36.0
    env:
      MISE_DATA_DIR: /root/.local/share/mise
      MISE_NOT_FOUND_AUTO_INSTALL: "0"
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Trust the workspace for git under hosted routing (baked container runs
      # git as ROOT over a uid-1001 checkout -> "dubious ownership" exit 128).
      # See the `check` job for the full rationale. No-op on the self-hosted lane.
      - name: Trust workspace for git (hosted container root-vs-checkout uid)
        run: git config --global --add safe.directory '*'

      - name: mise trust + install (baked tools — install is a near-no-op)
        run: |
          mise trust
          mise install

      - name: just check-mutants
        run: just check-mutants "origin/${{ github.base_ref || github.event.repository.default_branch }}"

  # Merge-gate fuzz run (livespec-console-beads-fabro-txtzn5.9). Three targets,
  # >=60s each, replaying the COMMITTED regression corpus under
  # fuzz/regressions/<target>/ so a crash that was ever found cannot come back
  # unnoticed. Needs the NIGHTLY toolchain: cargo-fuzz builds with
  # -Zsanitizer=address, which stable does not accept. `just ensure-fuzz-tooling`
  # installs both cargo-fuzz and the nightly toolchain, so no extra CI step is
  # needed here; the install is what makes this job's first run slow and later
  # ones warm.
  #
  # NOT a matrix job on purpose. It carries no tmux dependency and must not pull
  # tmux into the default matrix (this slice's ratified constraint), so it runs
  # as its own dedicated job exactly like check-mutants.
  check-fuzz:
    name: check-fuzz
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    container:
      image: ghcr.io/thewoolleyman/livespec-fabro-sandbox:python-rust-v1.36.0
    env:
      MISE_DATA_DIR: /root/.local/share/mise
      MISE_NOT_FOUND_AUTO_INSTALL: "0"
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Trust the workspace for git under hosted routing (baked container runs
      # git as ROOT over a uid-1001 checkout -> "dubious ownership" exit 128).
      # See the `check` job for the full rationale. No-op on the self-hosted lane.
      - name: Trust workspace for git (hosted container root-vs-checkout uid)
        run: git config --global --add safe.directory '*'

      - name: mise trust + install (baked tools — install is a near-no-op)
        run: |
          mise trust
          mise install

      # libfuzzer-sys compiles libFuzzer FROM SOURCE in its build script, so it
      # needs a C++ compiler. The sandbox image ships a Rust toolchain but no
      # c++, and without this the job fails in cc-rs with
      # `ToolNotFound: failed to find tool "c++"` before a single input is
      # fuzzed. Measured on this job's first run. Prefer an already-present
      # clang++ over an apt install so the common case costs nothing.
      - name: Ensure a C++ compiler for libfuzzer-sys
        run: |
          if command -v c++ >/dev/null 2>&1; then
            echo "c++ already present: $(command -v c++)"
          elif command -v clang++ >/dev/null 2>&1; then
            echo "using clang++ at $(command -v clang++)"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          else
            echo "no C++ compiler found; installing g++"
            apt-get update
            apt-get install -y --no-install-recommends g++
          fi

      # ---- Phase-span split (livespec-console-beads-fabro-icmvza) ----------
      # Warm ASAN build of ALL fuzz targets as a "Phase: compile" step so
      # export-ci-telemetry.sh emits a build.phase=compile span separating the
      # ASAN BUILD (a real optimization target) from the ratified 180s fuzz-run
      # floor (3x60s, not reducible — charter scope note). `cargo fuzz build`
      # with no target builds every fuzz target, so this needs no target list to
      # drift against the recipe. `just check-fuzz` below then rebuilds warm
      # (no-op reuse) and runs, under the "Phase: fuzz" name. Depends on the
      # fuzz-tooling + C++ compiler steps above.
      - name: "Phase: compile"
        run: |
          just ensure-fuzz-tooling
          cargo +nightly fuzz build

      - name: "Phase: fuzz"
        run: just check-fuzz

      # A crash is only actionable with the input that produced it. Without this
      # the gate reports "it crashed" and the reproducer dies with the runner.
      - name: Upload crash reproducers
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore

  # Single all-green gate job (livespec epic livespec-cf4bcu,
  # fleet-ci-aggregate-coverage). This is the SOLE branch-protection
  # required context: it `needs:` every check-bearing job, so requiring
  # only `ci-green` blocks merges on the entire matrix + dedicated check
  # jobs via one stable context-name that never churns as checks are
  # added. Pure GitHub-expression gate (no external action, no direct
  # tool invocation): `always()` runs it even when a dependency failed,
  # and the step fails the job iff any dependency failed or was cancelled.
  #
  # "needs every check-bearing job" is an INVARIANT TO MAINTAIN, not a
  # property that holds automatically — it was false for the whole span
  # `check-e2e-tmux` sat advisory, and this comment asserted it anyway.
  # This workflow defines exactly FIVE check-bearing jobs and all five
  # are listed. Adding a sixth without adding it here silently reopens
  # the gap.
  ci-green:
    name: ci-green
    needs: [check, check-doctor-static, check-e2e-tmux, check-mutants, check-fuzz]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: All required checks passed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1

  # Byte-for-byte copy of the livespec CORE reference
  # (.github/scripts/export-ci-telemetry.sh); repo-agnostic, driven by
  # $REPO/$RUN_ID from the workflow env. `needs` lists every top-level
  # check-bearing job so this runs last, after each job's timing is final.
  export-telemetry:
    name: export-telemetry
    needs: [check, check-doctor-static, check-e2e-tmux, check-mutants, check-fuzz]
    # PR runs now emit per-job telemetry too (fail-soft, via EXPORT_FAIL_SOFT
    # below) so optimization work can see before/after deltas on the PR, not
    # only after merge; push(master) keeps the closed-loop fail-loud contract.
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'pull_request') }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Export CI run telemetry to Honeycomb (closed-loop verified)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          HONEYCOMB_GITHUB_CI_INGEST_KEY_LIVESPEC: ${{ secrets.HONEYCOMB_GITHUB_CI_INGEST_KEY_LIVESPEC }}
          # push(master) stays closed-loop (empty ⇒ fail-loud); PR/merge_group
          # runs are fail-soft so a telemetry hiccup never red-bars a PR.
          EXPORT_FAIL_SOFT: ${{ github.event_name == 'push' && '' || '1' }}
        run: bash .github/scripts/export-ci-telemetry.sh
