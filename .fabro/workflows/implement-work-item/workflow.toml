# Run config for the implement-work-item phase graph — Architecture C:
# Fabro-owned docker sandbox mode (work-item livespec-impl-beads-wwn;
# design: livespec/tmp/fabro-architecture-c-design.md, proven end-to-end
# by the A2 probe run 01KTVX6AV677VBWPG63ERB4VH0 / dev-tooling PR #97).
#
# Launched by the Dispatcher (commands/dispatcher.py) from the TARGET
# repo's primary checkout as the invoking working directory:
#
#   cd <repo> && fabro run <materialized-config> --goal-file <brief>
#
# Fabro detects the GitHub origin from the cwd and clones FRESH inside
# the docker sandbox — local working-tree state never enters the run.
# The sandbox clone is the secondary-worktree EQUIVALENT under the
# family discipline: the prepare steps below provision it exactly like
# `just bootstrap` EXCEPT that the commit-refuse wrapper's refuse branch
# is DECLARED EXEMPT here so the Red-Green-Replay hook-manager gates run on
# every in-sandbox commit. The sandbox is a fresh FULL clone, so under
# the structural commit-refuse mechanism (livespec-zs22.7.3: refuse when
# git-dir == git-common-dir) it reads structurally as a primary checkout
# and its refuse branch WOULD fire. The prepare step sets
# `git config livespec.sandboxExempt true` — an explicit, declared marker
# the hook body reads to skip the refuse branch (per livespec core
# non-functional-requirements §"Conformance Pattern" concern #1
# Worktree-discipline, Exemption slot). This marker is set
# UNCONDITIONALLY and is backward-compatible: the legacy
# `livespec.primaryPath`-based body never reads it and (with primaryPath
# left unset) already fails open here, so setting the marker is a no-op
# for not-yet-migrated repos and arms every dispatched sandbox for the
# structural transition.
#
# CREDENTIAL CHANNEL (work-item livespec-impl-beads-am9, amended after
# the 2026-06-12 shadow shakedown): this committed file carries NO
# secret VALUE and NO `{{ env }}` interpolation. The Dispatcher
# materializes an UNCOMMITTED per-dispatch overlay of this file (mode
# 600, deleted when the run returns) that (a) rewrites the `graph`
# path below to an absolute path so it resolves from outside this
# directory, (b) APPENDS one depth-1 sibling-clone
# [[run.prepare.steps]] block per fleet member (from livespec master's
# .livespec-fleet-manifest.jsonc, fetched host-side via `gh api`; the dispatch
# target is excluded) so cross-repo checks resolve family siblings
# under /workspace/siblings inside the sandbox (work-item
# livespec-impl-beads-8m2), and (c) APPENDS an
# [environments.livespec-ci.env] table carrying the real
# CLAUDE_CODE_OAUTH_TOKEN value read from the Dispatcher's process
# environment and a GITHUB_TOKEN freshly minted from the GitHub App
# installation-token provider (the FULL name GITHUB_TOKEN, never the
# short GH_TOKEN: gh/git prefer GH_TOKEN, and fabro re-projects its own
# re-minted token per exec under GITHUB_TOKEN, so a projected GH_TOKEN
# would shadow fabro's fresh value and expire past the ~60-min TTL at a
# long run's publish node — the github-app-auth Pillar-1 anti-pattern)
# (github-app-auth Pillars 1+2: the dispatch
# TARGET's credential_wrapper injects the full per-wrapper set: GITHUB_APP_ID,
# GITHUB_PRIVATE_KEY, BEADS_DOLT_PASSWORD, and CLAUDE_CODE_OAUTH_TOKEN; no
# fleet-PAT fallback) — the run-scoped credential projection per the
# family-secrets scoped transient-materialization rule — plus the NON-secret
# LIVESPEC_SIBLING_CLONES_ROOT key (it rides in the same appended table because
# TOML forbids declaring that table twice, and the environment env table is the
# container-level channel that reaches every node's subprocesses, including
# `just check` and `gh pr create`). The Dispatcher is invoked under the
# dispatch target's own configured credential_wrapper from the target repo's
# .livespec.jsonc and refuses to dispatch when a credential is absent,
# and fails fast when the fleet manifest is unreachable or malformed.
# WHY NOT `{{ env }}` INTERPOLATION (do not re-attempt it): fabro
# resolves interpolations in the WORKER process, which fabro-server
# spawns with a fail-closed env allowlist (fabro-server/src/
# spawn_env.rs — PATH/HOME/TMPDIR/USER/RUST_*/FABRO_*/TERM etc. only),
# so for server-mediated runs the token never reaches the resolver and
# the LITERAL `{{ env.X }}` string flows into the sandbox. Proven
# empirically 2026-06-12 (runs 01KTX65N…/01KTX6HRWDEQ…): with the
# token present in BOTH the dispatcher's env AND the server daemon's
# env, the ACP node still received the literal string -> API 401.
# See commands/_dispatcher_plan.py `render_run_config_overlay`.
_version = 1

[workflow]
graph = "workflow.fabro"

[run]
goal = "Implement one ready work-item per the livespec family discipline"

# fabro-token-refresh part 1 — make Fabro OWN the fresh gh token.
# Requesting a push+PR-scoped GitHub App installation token makes
# `is_token_requested()` true, so Fabro's build_sandbox_env
# (fabro-workflow/src/pipeline/initialize.rs) builds a MINTABLE token source and
# re-projects a FRESH GITHUB_TOKEN into every node's ACP launch env at spawn —
# the value the in-sandbox `gh pr create` + rebase-auto-merge arming reads.
# WITHOUT this block Fabro builds NO token source (refresh_managed=false), so the
# external ACP agent's `gh` falls back to the Dispatcher's STATIC overlay
# GITHUB_TOKEN (minted once at dispatch) and 401s past the ~60-min
# installation-token TTL on a long run's publish node. This is precisely the
# per-exec re-mint the CREDENTIAL CHANNEL note above already ASSUMES but which
# was never actually requested. (git push is refreshed separately via origin-URL
# rotation at each ACP node entry — fabro-workflow acp.rs turn-entry re-mint.)
[run.integrations.github.permissions]
contents = "write"
pull_requests = "write"

[run.inputs]
# ONE ADAPTER INPUT PER ACP NODE. Every node below declares its own input so
# each node's adapter, model and reasoning effort is INDEPENDENTLY
# configurable — `dispatcher.acp_nodes.fix` can move the fix node alone
# without touching the implementer. The three implementer nodes previously
# shared a single `acp_adapter`, which made per-node configuration of `fix`
# or `review_fix` inexpressible no matter what the configuration said; the
# defaults below are deliberately IDENTICAL for the three, so splitting the
# input changed the surface and not the behaviour.
#
# A node's value is a complete adapter command line: leading `KEY=value`
# environment assignments (fabro parses them into the child's env), then the
# command, then its arguments. Model and reasoning effort are NOT separate
# fields — they ride the env for adapters that read them there
# (`ANTHROPIC_MODEL` and `CLAUDE_CODE_EFFORT_LEVEL` on the Claude adapter,
# `CODEX_CONFIG` on the Codex adapter) and MAY ride the arguments for an
# adapter whose own interface takes them on the command line. No adapter
# this repository pins uses the argument route for model or effort today.
# That is what makes ANY provider expressible with no code change: an
# Anthropic-Messages endpoint is `ANTHROPIC_BASE_URL` + `ANTHROPIC_AUTH_TOKEN`
# + `ANTHROPIC_MODEL` in the env, and an OpenAI-compatible one is
# `-c model_provider=<name>` plus its provider definition in the arguments.
# See `SPECIFICATION/contracts.md` §"ACP node adapter configuration".
#
# These are the WORKFLOW-DEFAULTS layer — the least specific of the three.
# The dispatch target's `dispatcher.acp_nodes` overrides them per node and
# per field, and a `--acp-node <node>=<adapter>` argument overrides both.
#
# WHY EVERY CLAUDE ADAPTER BELOW IS VERSION-LESS, AND WHY THAT IS THE PIN.
# `npx -y @agentclientprotocol/claude-agent-acp` carries no `@version` on
# purpose: it RESOLVES THE COPY BAKED INTO THE SANDBOX IMAGE pinned by the
# `docker` tag below, and never downloads one. `npx` is `npm exec`, which
# looks for the spec's bin NAME among the bins already installed — the
# project's `node_modules/.bin`, then the GLOBAL bin dir — and runs that copy
# when its version satisfies the requested spec, installing into
# `~/.npm/_npx` only on a miss. A version-less spec is satisfied by ANY
# installed copy, and the image installs this adapter globally
# (livespec-dev-tooling `docker/fabro-sandbox/agent/Dockerfile`:
# `npm install -g @agentclientprotocol/claude-agent-acp@$CLAUDE_AGENT_ACP_VERSION`,
# ARG-pinned), which links its bin `claude-agent-acp` into that global dir.
# So the lookup hits and no install is attempted.
#
# THE ADAPTER VERSION IS THEREFORE PINNED — by the image, not by this string,
# and bumping it means bumping the `docker` tag below. Do NOT "fix" these
# lines by appending an exact `@version`: that would be a SECOND declaration
# of a version the image already declares, and the two would have to move in
# lockstep by hand forever. The first missed bump silently un-pins the
# adapter, because a spec the baked copy cannot satisfy falls through to a
# registry download of an untested build — the exact moving-comparand defect
# the pin is meant to prevent. Measured in-sandbox on image
# `python-agent-v1.52.12`: the version-less form and `@0.44.0` both resolved
# the baked global offline with no npx cache created, while `@0.43.0` reached
# for registry.npmjs.org and created one. Full measurements, including the
# rejected `--no-install` variant and the residual hazard, in
# `plan/archive/pluggable-factory-workflow-configs/research/004-claude-agent-acp-baked-or-fetched-2026-09-06.md`
# (work-item bd-ib-yqpdrt.2).
#
# IMPLEMENTER NODES: Claude Opus 5 + high thinking. The Dispatcher emits
# these same adapters unless the dispatch target explicitly names
# `dispatcher.codex_models.implementer`, in which case it routes the
# implementer work to a Codex worker.
#
# LIVE ACCEPTANCE CHECK, still owed: the review adapter caveat below records
# that some old claude-agent-acp predecessors ignored ANTHROPIC_MODEL and
# defaulted to Haiku. The first dispatch after this default switch lands must
# verify the resolved model in the run transcript; an adapter string assertion
# does not prove runtime behavior.
implement_adapter = "ANTHROPIC_MODEL=claude-opus-5 CLAUDE_CODE_EFFORT_LEVEL=high npx -y @agentclientprotocol/claude-agent-acp"
fix_adapter = "ANTHROPIC_MODEL=claude-opus-5 CLAUDE_CODE_EFFORT_LEVEL=high npx -y @agentclientprotocol/claude-agent-acp"
review_fix_adapter = "ANTHROPIC_MODEL=claude-opus-5 CLAUDE_CODE_EFFORT_LEVEL=high npx -y @agentclientprotocol/claude-agent-acp"

# ACP adapter for the PR node. This is the SINGLE SOURCE of the publish
# node's fleet default (contracts.md section "Codex ACP node model pins",
# v107): a Claude adapter pinned to Claude Haiku 4.5 at high effort. Haiku is
# the cheap model this scripted `git`/`gh` node warrants, it is model-agnostic
# (no OpenAI/Codex catalog exposure), and pinning it — rather than leaving the
# model un-set — avoids the silent-smaller-model trap older claude-agent-acp
# builds had. Its PACKAGE version is pinned by the sandbox image; see the
# version-less rationale in the adapter-defaults block above. That bare-`fabro
# run` property is also why these defaults do NOT use `npx --no-install`:
# outside the family sandbox image there is no baked global, and the download
# is the intended fallback rather than a failure.
#
# The Dispatcher overrides this input via `fabro run --input pr_adapter=...`
# ONLY when the target repo explicitly configures `dispatcher.codex_models.pr`
# (routing the publish node to a Codex model) or `dispatcher.acp_nodes.pr`
# (any adapter); absent that, this default stands. It exists as a SEPARATE
# input from the implementer adapters so the publish node's model moves
# independently of theirs.
pr_adapter = "ANTHROPIC_MODEL=claude-haiku-4-5 CLAUDE_CODE_EFFORT_LEVEL=high npx -y @agentclientprotocol/claude-agent-acp"

# ACP adapter for the REVIEW node (Slice A / bd-ib-egms32) — the Claude
# subscription, pinned to Opus 4.8 + high thinking. The model CANNOT be set
# as a node attr or model_stylesheet: `model`/`reasoning_effort` are API-only
# attributes fabro REJECTS on acp nodes (fabro-validate backend_valid rule).
# The Claude ACP adapter is Claude Code under the hood, so it reads Claude
# Code's own env — the model is pinned by prefixing ANTHROPIC_MODEL +
# CLAUDE_CODE_EFFORT_LEVEL onto the command (fabro parses leading KEY=val
# assignments into the child's env).
#
# SAME PACKAGE AS THE IMPLEMENTER ADAPTERS ABOVE, AND VERSION-LESS FOR THE SAME REASON.
# This used to read `npx -y @zed-industries/claude-code-acp@latest`. That name
# is the DEPRECATED FORMER NAME of @agentclientprotocol/claude-agent-acp — npm
# says so outright ("This package has been renamed to
# @agentclientprotocol/claude-agent-acp"). It is not a second adapter; it is
# this one under a dead alias.
#
# The consequence was the opposite of what `@latest` suggests. `@latest` on a
# DEPRECATED package does not float — it is frozen at the tombstone (0.16.2,
# last published 2026-03-26) forever, while the implementer node ran THE SAME
# adapter under its current name at CLAUDE_AGENT_ACP_VERSION=0.44.0. Two nodes,
# one adapter, ~28 minor versions apart, and the review node could never receive
# an upstream fix. Dropping the name and the `@latest` resolves the global baked
# into the sandbox image (livespec-dev-tooling
# docker/fabro-sandbox/agent/Dockerfile), exactly as the implementer adapters do.
#
# LIVE ACCEPTANCE CHECK, still owed: a former caveat here recorded that some
# claude-code-acp versions ignored ANTHROPIC_MODEL and defaulted to haiku. That
# was observed on the frozen 0.16.x line and is plausibly fixed upstream long
# since, but "the review node actually runs on Opus 4.8" is only provable from a
# real run — verify the model in the transcript of the next dispatch. A green CI
# run does not substitute; CI never runs the review node.
review_adapter = "ANTHROPIC_MODEL=claude-opus-4-8[1m] CLAUDE_CODE_EFFORT_LEVEL=high npx -y @agentclientprotocol/claude-agent-acp"

# ACP adapter for the DISPOSITION node. Defaults to the same MODEL-un-pinned
# Claude adapter as `pr_adapter` — the same PACKAGE as `implement_adapter`, but
# with no ANTHROPIC_MODEL / CLAUDE_CODE_EFFORT_LEVEL prefix, so it does not
# inherit the implementer tier. Maintainers can pin the disposition model
# independently by prefixing adapter-owned env assignments here, using the same
# ANTHROPIC_MODEL / CLAUDE_CODE_EFFORT_LEVEL mechanism as `review_adapter`. The
# package version is pinned by the sandbox image, as for every Claude adapter
# here; see the version-less rationale in the adapter-defaults block above.
disposition_adapter = "npx -y @agentclientprotocol/claude-agent-acp"

# Review fix rounds count implementer repair rounds, not review visits. The
# workflow guard reads review node visits, so the default three fix rounds render
# as a visit guard of four: initial review visit plus three fix rounds.
review_fix_visit_cap = 4

# Disabled by default. The Dispatcher renders this to `succeeded` only when the
# effective merge_on_review_cap escape hatch is true for the item.
merge_on_review_cap_outcome = "__merge_on_review_cap_disabled__"

# The PER-ITEM MERGE HOLD (SPECIFICATION/contracts.md §"Dispatcher policy
# settings" -> "The per-item merge hold"), the third member of the per-item
# POLICY input family beside the two above. While it is true the pr node
# publishes exactly as it does today but arms NO auto-merge and verifies that
# none is armed, so an item can be IMPLEMENTED now and MERGED in a window the
# maintainer chooses.
#
# FALSE HERE IS NOT A REPOSITORY-LEVEL DEFAULT — the hold deliberately has
# none. It is set on ONE item, by a person, for ONE merge, through the human
# valve `set-merge-hold:<work-item-id>:on|off`, and the Dispatcher renders that
# item's effective hold here on every dispatch. This default is only ever seen
# by a bare `fabro run` of this file, which then publishes and arms exactly as
# it did before this input existed.
#
# TWO SEAMS READ THE ONE RENDERED VALUE AND NEITHER IS AUTHORITATIVE: the pr
# prompt reads this input inside the sandbox, and the Dispatcher's own
# auto-merge argv reads the same resolved hold host-side. A hold that reached
# only one of them would silently not hold.
merge_hold = false

# INTEGRATION-CONTRACT INPUTS — the typed workflow inputs of
# SPECIFICATION/contracts.md §"Repository integration contract" (the
# typed-workflow-inputs clause). Each is ONE field of the governed repository's
# `RepoIntegrationContract`, resolved exactly once by the Dispatcher at
# plan-build time on the host and rendered here as `fabro run --input
# <name>=<value>`; this run config, the graph, and the node prompts all read
# the SAME `inputs.<name>` token, which is what makes them projections of one
# resolved object rather than three restatements of it. The set below is the
# projection's closed `CONTRACT_INPUT_NAMES`, and the `check-seam-equivalence`
# gate asserts — statically, in both directions — that these declarations, the
# tokens the payload references, and the Dispatcher's rendered inputs are
# identical and that every token sits where the pinned engine renders it.
#
# THE DEFAULTS CARRY NO FLEET-TOOLCHAIN PREMISE — none of the tokens the
# `check-no-fleet-toolchain-literals` gate bans appears here, because that
# gate scans this file. Three kinds of default follow from that. The
# toolchain and conformance inputs default to the ratified explicit NO-OP
# (the empty string: the prepare step it templates runs nothing).
# `sandbox_check_suite`, the one input a run cannot do without, defaults to a
# command that FAILS LOUDLY naming the input, so a bare `fabro run` of this
# file can never pass its janitor gate vacuously. The three non-toolchain
# inputs — `sandbox_exempt_marker`, `default_branch`, `merge_mode` — default
# to the same values the plugin's fleet-defaults module resolves, because
# those values are not fleet tooling. A default is only ever SEEN by a bare
# `fabro run` of this file without the Dispatcher: a DISPATCHED run receives
# every value below from the resolved contract, because the Dispatcher
# renders every input this table declares.
#
# Command-shaped values arrive as ONE shell word-list (`shlex.join` of the
# contract's argv), which is why every prepare step that reads one re-tokenizes
# it with `set --` rather than quoting it.
sandbox_check_suite = "sh -c 'echo LIVESPEC_INPUT_NOT_RENDERED: sandbox_check_suite was not supplied by the Dispatcher >&2; exit 1'"
prepare_toolchain_mise = ""
prepare_toolchain_lefthook = ""
conformance_hook_install = ""
conformance_verify_commit_refuse_hook = ""
conformance_verify_plugin_resolution = ""
sandbox_exempt_marker = "livespec.sandboxExempt"
default_branch = "master"
merge_mode = "rebase"

[run.environment]
id = "livespec-ci"

[environments.livespec-ci]
provider = "docker"

[environments.livespec-ci.image]
# GHCR-published family sandbox image (the fleet toolchain — version
# manager, uv, recipe runner, hook manager — plus node/ACP adapter + gh;
# Dockerfile in livespec-dev-tooling). Published
# by dev-tooling PR #111 (2026-06-12) to
# ghcr.io/thewoolleyman/livespec-fabro-sandbox. Since the layered-image
# split this consumer pulls the `python-agent` layer (base tools + uv +
# CPython, plus the agent payload: bubblewrap and both ACP adapters; no
# Rust). Tag format:
#   python-agent-sha-<short>  — per master-build (mutable; tracks HEAD)
#   python-agent-v<X.Y.Z>     — per release tag (immutable)
#
# WHY `python-agent` AND NOT `python`: the agent payload (bubblewrap +
# both ACP adapters) was moved OUT of the base layer into an `agent`
# layer stacked on top of `python`, because CI never uses it and it is
# 316.6 MB of every CI job's image pull (livespec-dev-tooling-a46). The
# bare `python-` tag is now the SLIM, CI-facing image and carries NO ACP
# adapters. A Fabro sandbox pinned to it does NOT fail loudly: the
# version-less `npx -y` adapter command below simply re-downloads the
# adapter at runtime, silently reintroducing the per-run tax the baked
# image exists to eliminate (Codex fails loudly instead, on missing
# bubblewrap). So this pin MUST keep the `python-agent-` prefix.
#
# PIN SURFACE NOTE: this docker image tag is now covered by the shared
# `bump-pin` autodiscovery — livespec-dev-tooling (>= v0.40.0) ships a
# `fabro_sandbox_docker_image` pin format, so the release fan-out rewrites the
# `docker = "...:python-agent-vX.Y.Z"` tag below in lockstep with the
# livespec-dev-tooling pin in pyproject.toml, exactly like every other cross-repo
# pin — preserving the `python-agent-` layer prefix and rewriting only the
# `vX.Y.Z` version. That prefix-preservation is what keeps this pin on the agent
# layer once set, but it is ALSO why the one-time migration off the bare
# `python-` prefix had to be made by hand: the fan-out preserves whatever prefix
# it finds, so it would have kept this pin on the slim CI image forever. The producer-side lockstep gate
# (the shared dev-tooling package's `fabro_image_pin_lockstep` check) guards the Dockerfile ARG pins
# in livespec-dev-tooling and does not run in consumer repos.
#
# HOST-LOCAL STEP: if ~/.fabro/environments/livespec-ci.toml exists on
# a developer's machine (the pre-p60 local-image fallback), update its
# `image` key to match this committed value so host-local `fabro run`
# invocations use the same GHCR tag. The host-local file MUST contain
# only `provider = "docker"` + `[image] docker = "..."` — never an
# `[env]` table (the Dispatcher's per-dispatch overlay owns that block;
# TOML forbids duplicate table declarations).
docker = "ghcr.io/thewoolleyman/livespec-fabro-sandbox:python-rust-agent-v1.85.2"

[environments.livespec-ci.resources]
cpu = 4
memory = "8GB"

# NOTE: deliberately NO [environments.livespec-ci.env] table here. The
# Dispatcher's per-dispatch overlay APPENDS that table carrying the
# real CLAUDE_CODE_OAUTH_TOKEN and GITHUB_TOKEN values plus the non-secret
# LIVESPEC_SIBLING_CLONES_ROOT key at dispatch time (TOML forbids
# duplicate table declarations, so this committed file must not declare
# it — which is also why the non-secret key lives in the appended
# table rather than here). A fabro env-interpolation line
# (`{{ env.* }}` style) for the token would NOT work either — the
# server-spawned worker resolves interpolations under a fail-closed
# env allowlist (fabro-server/src/spawn_env.rs) and would pass the
# literal string through to the sandbox (API 401). See the CREDENTIAL
# CHANNEL note in the header.

[run.clone]
enabled = true

# Fabro-managed run/meta branches stay LOCAL to the sandbox (push=false,
# probe discipline): the pr stage publishes the work under
# refs/heads/feat/<work-item-id> itself, so fabro/run/* never pollutes
# the remote.
[run.run_branch]
enabled = true
push = false

[run.meta_branch]
enabled = true
push = false

[run.checkpoint]
# Hooks stay ON for checkpoint commits: the corrected content-trigger
# red-green-replay gate (livespec-dev-tooling v0.11.0, bumped
# family-wide) passes machine/empty checkpoint commits naturally, so
# the interim skip_git_hooks=true escape from the probe is retired.
# Gate-heavy repositories can legitimately spend minutes in those hooks.
# Fabro's stock 30-second checkpoint budget destroyed completed work when
# `git add` or `git commit` crossed that ceiling (ledger bd-ib-6ka).
commit_timeout = "10m"
skip_git_hooks = false
exclude_globs = ["**/.venv/**", "**/node_modules/**", "**/.cache/**"]

# Our pr graph node owns the family `gh pr` flow (body conventions,
# rebase auto-merge arming); Fabro's native PR surface stays off.
[run.pull_request]
enabled = false

# --- Prepare steps: provision the clone as the secondary-worktree
# --- equivalent (Architecture C "RGR steeling", minus primaryPath).
#
# EVERY TOOLCHAIN AND CONFORMANCE PREMISE BELOW IS A PROJECTION, NOT A
# LITERAL. The command each step runs arrives as an `inputs.<name>` value the
# Dispatcher rendered from the governed repository's resolved integration
# contract (SPECIFICATION/contracts.md §"Repository integration contract"; the
# fleet-member values live in this repo's `.livespec.jsonc` and the plugin's
# fleet-defaults module, never here). A premise the repository does not carry
# resolves to the ratified explicit NO-OP — the empty word-list — and the step
# then runs nothing, by construction rather than by a silent skip
# (contracts.md §"Factory-sandbox toolchain disposition").
#
# THE `set --` IDIOM. A command-shaped input crosses the sandbox boundary as
# one shell word-list (`shlex.join` of the contract's argv). `set -- <list>`
# has the shell re-tokenize it back into the exact argv, `test $# -eq 0`
# makes the empty no-op a clean exit rather than a syntax error, and `"$@"`
# runs the argv with its quoting intact. No step quotes the token itself,
# because the value may legitimately carry quotes of its own.

[[run.prepare.steps]]
# Fabro's sandbox clone is hardcoded shallow (GIT_CLONE_DEPTH=10, no
# config knob in v0.254.0); the RGR range checks and the check suite diff
# the default branch..HEAD, which needs the default-branch merge-base present.
script = "git fetch --unshallow --quiet"

[[run.prepare.steps]]
# Toolchain premise #1 — the version-manager install (the version-manager
# arm of `dispatcher.prepare_toolchain`). This repository declares it in
# `.livespec.jsonc`, where the rationale for its anonymous, credential-scrubbed
# form lives beside the command (work-item bd-ib-bic7hb); an adopter without a
# version manager declares nothing and the step is the ratified no-op.
script = "set -- {{ inputs.prepare_toolchain_mise }}; test $# -eq 0 || \"$@\""

[[run.prepare.steps]]
script = "uv sync --all-groups"

[[run.prepare.steps]]
# Toolchain premise #2 — the hook-manager install (the hook-manager arm of
# `dispatcher.prepare_toolchain`); no-op for an adopter without one.
script = "set -- {{ inputs.prepare_toolchain_lefthook }}; test $# -eq 0 || \"$@\""

[[run.prepare.steps]]
# Dispatch-time baseline conformance gate — the MECHANISM (Conformance
# Pattern concern #1 Worktree-discipline): install the canonical STRUCTURAL
# commit-refuse hook at pre-commit, pre-push AND commit-msg. Field
# `dispatcher.conformance.hook_install`: `internal_livespec_dev_tooling`
# renders the shared dev-tooling installer module (whose FAMILY-UNIFORM
# canonical body ships in that wheel, so every dispatched sandbox installs
# the identical body the same way; the prior `uv sync --all-groups` step put
# the package in the sandbox venv), `shell_argv` runs the adopter's own
# installer, and `no_op` skips the step. The structural body's hook-manager
# delegation fires the Red-Green-Replay gates on every in-sandbox commit (the
# refuse branch is skipped by the exemption marker set in the next step).
script = "set -- {{ inputs.conformance_hook_install }}; test $# -eq 0 || \"$@\""

[[run.prepare.steps]]
# Declare the sandbox EXEMPT from the commit-refuse refuse branch
# (livespec-zs22.7.3, Conformance Pattern concern #1 Worktree-discipline,
# Exemption slot). The sandbox is a fresh FULL clone — structurally a
# primary checkout — so the structural commit-refuse hook would refuse
# its in-sandbox Red-Green-Replay commits. This explicit, declared marker
# (read by the hook body via `git config --get <marker>`) skips the refuse
# branch so commits proceed; the hook-manager delegation in the hook body
# still fires the RGR gates. The marker NAME is the resolved
# `dispatcher.sandbox_exempt_marker` field (contracts.md §"Dispatch-time
# baseline conformance gate"), projected here rather than spelled. Set
# UNCONDITIONALLY. It is NOT a harmless no-op for every hook shape: a body
# that never reads the marker (the legacy livespec.primaryPath-based body)
# ignores it, but an adopter-authored WRITE-time structural hook without the
# exemption slot fails CLOSED — it denies the sandbox's in-clone writes even
# with the marker set (proven live on homelab runs 01M107EF8QMRF66RGH9T393CQV
# and 01M186Y59CEBP2CNZ9ESSR3DHA, 2026-08-30; agents then improvised worktrees
# and fabro's --allow-empty checkpoints minted empty commits). Honoring the
# marker is therefore a ratified adopter-hook obligation (v094; contracts.md
# §"Dispatch-time baseline conformance gate"), exercised by the C6 honor and
# non-honoring fixture tests; a prepare-time writability probe that would
# refuse such a hook loudly is the pending propose-change recorded as plan
# bd-ib-vblnq2 deferral D5. Local config only — never leaves the ephemeral
# sandbox (pushes carry refs, not config).
script = "git config {{ inputs.sandbox_exempt_marker }} true"

[[run.prepare.steps]]
# Dispatch-time baseline conformance gate — Verifier #1 (Conformance
# Pattern concern #1 Worktree-discipline). After the Mechanism is installed
# and the sandbox is declared exempt above, assert the hook is ACTUALLY
# present at the primary's shared .git/hooks. Field
# `dispatcher.conformance.verify_commit_refuse_hook`: the internal mode
# renders the SHARED livespec-dev-tooling Verifier (reused, not
# re-implemented — the same Verifier the commit-time and fleet-time tiers
# run). A non-zero exit aborts the run before any work is driven — the gate
# makes every dispatched sandbox conformant by construction. Codified in
# SPECIFICATION/contracts.md §"Dispatch-time baseline conformance gate".
script = "set -- {{ inputs.conformance_verify_commit_refuse_hook }}; test $# -eq 0 || \"$@\""

[[run.prepare.steps]]
# Dispatch-time baseline conformance gate — Verifier #2 (Conformance
# Pattern concern #2 cross-harness plugin-resolution), field
# `dispatcher.conformance.verify_plugin_resolution`. In the internal mode
# this is the shared Verifier's declaration-integrity (mock) mode: it reads
# the dispatched repo's optional .livespec.jsonc `harnesses` declaration and
# fail-closes on a malformed one. A non-zero exit aborts the run.
# Enforcement-in-depth: one Verifier layered across the tiers.
script = "set -- {{ inputs.conformance_verify_plugin_resolution }}; test $# -eq 0 || \"$@\""
