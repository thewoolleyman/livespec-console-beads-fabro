[package]
name = "console-ci-parity-check"
description = "Parity gate between just check targets and CI check jobs"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true
# Internal check crate — never published.
publish = false

[dependencies]
serde_json = "1"
# default-features off: the only default, `encoding`, pulls encoding_rs (BSD-3-Clause,
# outside deny.toml's allow-list) for the byte decoder this crate never calls.
yaml-rust2 = { version = "0.13", default-features = false }

[lints]
workspace = true
