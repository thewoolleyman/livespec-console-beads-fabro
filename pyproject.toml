# pyproject.toml — livespec-console-beads-fabro Python dev-tooling pin.
#
# The console is a PURE-RUST workspace (see Cargo.toml / crates/). This file
# exists for ONE reason: to REUSE the shared livespec-dev-tooling commit-refuse
# hook installer + the `baseline` worktree-discipline verifier, rather than
# re-implementing either in Rust or shell. Per
# livespec/SPECIFICATION/non-functional-requirements.md §"Conformance Pattern"
# the `baseline` profile's Mechanism/Installer/Verifier are REUSED (pinned and
# imported from livespec-dev-tooling), never copied — so there is no per-repo
# body to drift.
#
# NO [build-system] / [project.dependencies]: the console publishes no Python
# package and ships no Python runtime — `uv` resolves only the dev-group tool
# below into a project-local .venv via `uv sync --all-groups`. mise pins the
# non-Python binaries (uv, just, lefthook) in .mise.toml.

[project]
name = "livespec-console-beads-fabro"
version = "0.0.0"
description = "Control-Plane operator console for the Beads/Fabro livespec family (pure-Rust; this pyproject carries only the shared dev-tooling reuse pin)"
requires-python = ">=3.10.16"
authors = [
    { name = "Chad Woolley", email = "thewoolleyman@gmail.com" },
]

[dependency-groups]
# livespec-dev-tooling is consumed from the github.com sibling-library repo via
# the uv git source below, per
# livespec/SPECIFICATION/contracts.md §"Shared code sync — livespec-dev-tooling".
# Bump-pin PRs land each new release tag per
# livespec/SPECIFICATION/contracts.md §"Cross-repo coordination — pin-and-bump".
dev = [
    "livespec-dev-tooling",
    "livespec-runtime>=0.20.0",
    "returns>=0.25.0",
    # livespec-dev-tooling vendors structlog but declares no runtime
    # [project.dependencies], so its vendored structlog's own transitive
    # need for typing-extensions is unmet in this minimal env (other fleet
    # repos get it incidentally via pyright/hypothesis in their dev groups).
    # structlog imports `Self` from typing_extensions on Python < 3.11
    # (`typing.Self` is 3.11+), so the baseline installer/verifier would fail
    # to import on this repo's pinned 3.10.16 without it. Pinned to the fleet
    # version. (Systemic fix: livespec-dev-tooling should declare structlog's
    # runtime deps in [project.dependencies] so every consumer gets them.)
    "typing-extensions==4.15.0",
]

[tool.uv.sources]
livespec-dev-tooling = { git = "https://github.com/thewoolleyman/livespec-dev-tooling.git", tag = "v1.44.0" }
livespec-runtime = { git = "https://github.com/thewoolleyman/livespec-runtime.git", tag = "v0.21.3" }

[tool.livespec_dev_tooling]
plan_lifecycle_anchor = true

# ---------------------------------------------------------------------------
# Role-key declarations (fleet row `required-role-keys-declared`, sibling row
# `role-key-spellings`; livespec-console-beads-fabro-jzi3).
#
# WHY THIS BLOCK EXISTS: the justfile wires layout-dependent dev-tooling checks
# (the ones whose modules import `load_config`: plan-anchor, plugin-resolution,
# shell-quality, ...), which makes this repo a "layout-dependent check consumer"
# in the fleet contract's sense, so EVERY entry of REQUIRED_ROLE_KEYS must be
# declared explicitly. Undeclared, the fleet release fan-out EXCLUDES this repo
# from the dispatch matrix ("failing conformance rows: required-role-keys-
# declared"), which is why no bump-pin PR has reached it since 2026-08-21 and
# its sandbox image pin sat at python-rust-v1.40.1 while v1.43.1 shipped.
#
# WHAT IS TRUE HERE: this is a PURE-RUST workspace (Cargo.toml / crates/). The
# only first-party `.py` files are two dev-tooling scripts
# (dev-tooling/coverage-gate.py, dev-tooling/check-spec-governance-default-
# block.py); there is no Python product source, no io/commands/pure layer, no
# schemas/dataclasses layer, and no Python hook body. The spellings follow the
# fleet's no-Python-product-surface precedent (livespec-driver-pi):
#
#  - The five PREDICATE keys keep the strict empty spelling `[]`: their
#    consuming checks derive the universe from `resolve_check_universe()` and
#    read the key only to widen an exemption, so empty makes them STRICTER.
#  - The five UNION keys carry ONE blessed declared-absent spelling each, with
#    the reason in the parsed value (a bare `[]` / "" there is the retired
#    ambiguous spelling the `role-key-spellings` row rejects).
#
# Should the console ever acquire Python product source, replace the
# not_applicable values with real paths in the same change.
# ---------------------------------------------------------------------------
# No Python product source: the product is the Rust workspace under crates/.
source_trees = []
# No separate Python io tree.
io_trees = []
# No Python command modules.
commands_trees = []
# No Python supervisor entry points (the binaries are Rust).
supervisor_entry_files = []
# No first-party Python bodies to hold at the coverage floor beyond the
# git-derived universe (the two dev-tooling scripts), which needs no extra tree.
covered_trees = []
# NOT APPLICABLE: no pure parse/validate Python layer for the mutation /
# property-based-testing / API-result gates to scan; the Rust workspace carries
# its own mutation (cargo-mutants) and fuzz gates in the justfile.
pure_trees = { not_applicable = "pure-Rust workspace: no pure parse/validate Python layer; Rust mutation and fuzz gates live in the justfile" }
# SUPERSEDED, not not-applicable: Python coverage of the two dev-tooling
# scripts is owned by the git-derived first-party universe, not a declared
# target-dir list.
target_dirs = { superseded_by = "git-derived first-party universe owns this repo's Python coverage" }
# NOT APPLICABLE: the Python co-staging gate (commit_pairs_source_and_test) has
# no Python product source to scope; the equivalent discipline for the Rust
# surface is the console-red-green-replay-check crate wired in lefthook.yml.
source_tree_prefixes = { not_applicable = "pure-Rust workspace: no Python product source to scope; Rust co-staging discipline is the console-red-green-replay-check crate" }
# NOT APPLICABLE: no Python schemas/dataclasses layer (the domain types are Rust).
dataclasses_tree = { not_applicable = "pure-Rust workspace: no Python schemas/dataclasses layer" }
# NOT APPLICABLE: this repo ships no Python hook body to hold identical to the
# single-sourced neutral hook; the commit-refuse hook is the REUSED
# livespec-dev-tooling installer (see the header of this file).
neutral_hook_body_path = { not_applicable = "no Python hook body is shipped here; the commit-refuse hook is the reused livespec-dev-tooling installer" }
